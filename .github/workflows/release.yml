name: SAMM Release Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binary
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npx tsx --test src/tests/domain.test.ts

      - name: Build Frontend Distribution
        run: npm run build

      - name: Run Rust Unit & Integration Tests
        run: |
          cd src-tauri
          cargo test --lib

      - name: Build Production Release Binary
        run: |
          cd src-tauri
          cargo build --release

      - name: Prepare Release Artifacts
        shell: powershell
        run: |
          $ver = if ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag_name }}" }
          if (-not $ver) { $ver = "v0.2.0" }
          
          # Stage binary and package zip
          Copy-Item "src-tauri\target\release\samm.exe" -Destination "SAMM.exe" -Force
          Compress-Archive -Path "SAMM.exe" -DestinationPath "SAMM-Windows-x64-$ver.zip" -Force
          Get-Item "SAMM-Windows-x64-$ver.zip" | Select-Object Name, Length

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: SAMM Release ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SAMM-Windows-x64-*.zip
            SAMM.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
