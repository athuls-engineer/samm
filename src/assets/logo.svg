<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242833" />
      <stop offset="100%" stop-color="#12141a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Plate -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bgGrad)" stroke="#2b3140" stroke-width="2.5" filter="url(#dropShadow)"/>

  <!-- Golden Outer Shield Emblem -->
  <path d="M 64 16 L 104 32 C 104 74 64 108 64 108 C 64 108 24 74 24 32 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Inner Dark Crest Fill -->
  <path d="M 64 22 L 98 36 C 98 70 64 99 64 99 C 64 99 30 70 30 36 Z" 
        fill="url(#innerGrad)" stroke="#383f52" stroke-width="1.5" />

  <!-- Distinctive Gothic / Street Emblem "SA" -->
  <!-- Letter S -->
  <path d="M 58 42 C 45 42 41 46 41 51 C 41 57 47 59 55 61 C 65 63 71 66 71 74 C 71 83 63 87 51 87 C 42 87 36 84 33 80 L 37 73 C 40 76 45 79 51 79 C 58 79 62 76 62 72 C 62 67 56 65 48 63 C 39 61 32 57 32 49 C 32 42 39 36 51 36 C 59 36 64 38 68 41 L 64 48 C 60 45 56 42 58 42 Z" 
        fill="#ffffff" />

  <!-- Letter A -->
  <path d="M 78 37 L 93 86 L 84 86 L 80 72 L 67 72 L 67 65 L 78 65 L 75 51 L 70 65 L 67 65 L 74 37 Z" 
        fill="url(#shieldGrad)" />

  <!-- Small Gear / Wrench Modding Icon Accent at bottom -->
  <circle cx="64" cy="92" r="4.5" fill="#f59e0b" />
  <circle cx="64" cy="92" r="2" fill="#12141a" />
</svg>
